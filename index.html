<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just TV - Watch & Earn</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ff0000 0%, #0000ff 100%);
            --card-bg: rgba(0, 0, 0, 0.7);
            --text-color: #ffffff;
            --accent: #00f2fe;
            --btn-color: #ff0055;
        }

        [data-theme="dark"] {
            --bg-gradient: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --accent: #ff0055;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0; padding: 15px;
            transition: all 0.5s ease;
            min-height: 100vh;
        }

        #access-denied { display: none; text-align: center; margin-top: 100px; font-size: 20px; font-weight: bold; }

        .top-bar {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin: 20px 0;
        }

        #searchBox {
            width: 70%; padding: 12px 20px; border-radius: 30px; border: 3px solid var(--btn-color);
            background: #ffffff; color: #000; font-size: 16px; font-weight: bold; outline: none;
        }

        .switch {
            position: relative; display: inline-block; width: 50px; height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-round {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 34px;
        }
        .slider-round:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider-round { background-color: var(--btn-color); }
        input:checked + .slider-round:before { transform: translateX(24px); }

        .count-info { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 15px; text-shadow: 1px 1px 5px #000; }

        .flipper-container {
            width: 100%; max-width: 300px; margin: 0 auto 25px; perspective: 1000px;
        }
        .flipper-card {
            width: 100%; aspect-ratio: 2/3; position: relative;
            transform-style: preserve-3d; transition: transform 0.6s;
        }
        .flipper-card img {
            width: 100%; height: 100%; border-radius: 15px; object-fit: cover;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); border: 2px solid white;
        }

        .movie-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; max-width: 900px; margin: 0 auto;
        }

        .movie-card {
            background: var(--card-bg); border-radius: 15px;
            overflow: hidden; border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s;
        }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #000; }
        .info { padding: 12px; text-align: center; }
        .title { font-size: 14px; font-weight: bold; height: 40px; overflow: hidden; color: var(--accent); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .btn-watch {
            display: block; padding: 10px; background: var(--btn-color);
            color: white !important; text-decoration: none; border-radius: 10px;
            font-weight: bold; font-size: 13px; cursor: pointer; border: none; width: 100%;
        }

        .pagination { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
        .nav-btn {
            padding: 10px 20px; border: none; border-radius: 25px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: white; font-weight: bold; cursor: pointer;
        }
        .nav-btn:disabled { background: #666; }

        #loader { text-align: center; margin-top: 50px; }
        .spinner { width: 40px; height: 40px; border: 5px solid rgba(255,255,255,0.3); border-top: 5px solid var(--btn-color); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="main-content">
    <div class="top-bar">
        <input type="text" id="searchBox" placeholder="Search movies..." onkeyup="handleSearch()">
        <label class="switch">
            <input type="checkbox" id="themeToggle" onclick="toggleTheme()">
            <span class="slider-round"></span>
        </label>
    </div>

    <div class="count-info" id="totalCount">Total Movies: Loading...</div>

    <div class="flipper-container" id="flipperArea" style="display:none;">
        <div class="flipper-card" id="flipperCard">
            <img id="flipperImg" src="" alt="Featured">
        </div>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <div class="movie-grid" id="movie-list"></div>

    <div class="pagination" id="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">Next</button>
    </div>
</div>

<div id="access-denied">Access Denied! Please use the official app.</div>

<script>
    // User Agent Security Check
    const REQUIRED_AGENT = "jastv";
    const userAgent = navigator.userAgent.toLowerCase();

    if (!userAgent.includes(REQUIRED_AGENT)) {
        document.getElementById('main-content').style.display = 'none';
        document.getElementById('access-denied').style.display = 'block';
        document.body.style.background = "#000";
    } else {
        const SPREADSHEET_ID = '1O_Ow3sEUcKWfA3sBSAV7e5y3HYuqTMu-Ayq0wIjNapc';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv`;
        const DEFAULT_IMG = 'https://i.giphy.com/media/3zhxq2ttgN6rEw8SDx/giphy.gif';

        let allMovies = [];
        let filteredMovies = [];
        let currentPage = 1;
        const itemsPerPage = 50;

        function toggleTheme() {
            const body = document.body;
            const isChecked = document.getElementById('themeToggle').checked;
            if (isChecked) body.setAttribute('data-theme', 'dark');
            else body.removeAttribute('data-theme');
        }

        async function init() {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                const rows = text.split('\n').slice(1);
                allMovies = rows.map(r => {
                    const c = r.split(',');
                    return {
                        name: c[0]?.replace(/"/g, "").trim() || '',
                        link: c[1]?.replace(/"/g, "").trim() || '#',
                        img: c[2]?.replace(/"/g, "").trim() || ''
                    };
                }).filter(m => m.name !== "");
                
                finishInit();
            } catch (e) {
                document.getElementById('loader').innerText = "Network Error!";
            }
        }

        function finishInit() {
            filteredMovies = allMovies;
            updateCountLabel(allMovies.length, false);
            document.getElementById('loader').style.display = 'none';
            document.getElementById('flipperArea').style.display = 'block';
            startFlipper();
            renderPage();
        }

        function startFlipper() {
            const randomMovies = [...allMovies].sort(() => 0.5 - Math.random()).slice(0, 10);
            let idx = 0;
            const imgEl = document.getElementById('flipperImg');
            const cardEl = document.getElementById('flipperCard');

            setInterval(() => {
                cardEl.style.transform = 'rotateY(90deg)';
                setTimeout(() => {
                    imgEl.src = randomMovies[idx].img || DEFAULT_IMG;
                    cardEl.style.transform = 'rotateY(0deg)';
                    idx = (idx + 1) % randomMovies.length;
                }, 300);
            }, 3000);
        }

        function updateCountLabel(count, isSearching) {
            const label = document.getElementById('totalCount');
            label.innerText = isSearching ? `Movies Found: ${count}` : `Total Movies: ${count}`;
        }

        // মুভি লিঙ্ক একই পেজে ওপেন করার ফাংশন
        function handleWatchClick(movieLink) {
            window.location.href = movieLink;
        }

        function renderPage() {
            const start = (currentPage - 1) * itemsPerPage;
            const pageItems = filteredMovies.slice(start, start + itemsPerPage);
            const container = document.getElementById('movie-list');
            container.innerHTML = '';
            
            pageItems.forEach(m => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${m.img || DEFAULT_IMG}" onerror="this.src='${DEFAULT_IMG}'">
                    <div class="info">
                        <div class="title">${m.name}</div>
                        <button class="btn-watch" onclick="handleWatchClick('${m.link}')">WATCH NOW</button>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = start + itemsPerPage >= filteredMovies.length;
        }

        function handleSearch() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            filteredMovies = allMovies.filter(m => m.name.toLowerCase().includes(query));
            currentPage = 1;
            updateCountLabel(filteredMovies.length, query.length > 0);
            renderPage();
        }

        function changePage(step) {
            currentPage += step;
            renderPage();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        init();
    }
</script>

</body>
</html>
