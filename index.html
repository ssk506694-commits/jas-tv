<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just TV - Watch & Earn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ff0000 0%, #0000ff 100%);
            --card-bg: rgba(0, 0, 0, 0.7);
            --text-color: #ffffff;
            --accent: #00f2fe;
            --btn-color: #ff0055;
            --glass-blur: 0px;
        }

        [data-theme="glass"] {
            --bg-gradient: linear-gradient(45deg, #0f2027, #203a43, #2c5364);
            --card-bg: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --accent: #ffeb3b;
            --btn-color: rgba(255, 255, 255, 0.2);
            --glass-blur: 10px;
        }

        [data-theme="purple"] {
            --bg-gradient: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --card-bg: rgba(45, 0, 80, 0.8);
            --text-color: #ffffff;
            --accent: #00ffa3;
            --btn-color: #9c27b0;
        }

        [data-theme="gold"] {
            --bg-gradient: linear-gradient(135deg, #1a1a1a 0%, #434343 100%);
            --card-bg: rgba(0, 0, 0, 0.8);
            --text-color: #ffd700;
            --accent: #ffffff;
            --btn-color: #d4af37;
        }

        [data-mode="dark"] {
            --bg-gradient: #0f0f0f !important;
            --card-bg: #1a1a1a !important;
            --text-color: #e0e0e0 !important;
            --accent: #ff0055 !important;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0; padding: 15px;
            transition: all 0.4s ease;
            min-height: 100vh;
        }

        .header-controls { display: flex; align-items: center; gap: 10px; max-width: 900px; margin: 10px auto 20px; }
        .theme-btn { background: var(--btn-color); border: 2px solid white; color: white; padding: 8px 12px; border-radius: 50%; cursor: pointer; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .search-container { flex-grow: 1; }
        #searchBox {
            width: 100%; padding: 12px 20px; border-radius: 30px; border: 3px solid var(--btn-color);
            background: #ffffff; color: #000000; font-size: 16px; font-weight: bold; outline: none; box-sizing: border-box;
        }

        .switch { position: relative; display: inline-block; width: 45px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--btn-color); }
        input:checked + .slider:before { transform: translateX(20px); }

        #loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg-gradient); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 9999; 
        }
        .load-anim {
            width: 60px; height: 60px; border: 6px solid rgba(255,255,255,0.2);
            border-top: 6px solid var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .load-text { font-size: 18px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .fetch-source { font-size: 12px; margin-top: 10px; color: var(--accent); }

        .count-info { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 15px; }

        #flipper-container { margin-bottom: 25px; transition: 0.3s; }
        .swiper { width: 100%; max-width: 900px; height: 250px; border-radius: 15px; }
        .swiper-slide {
            background-position: center; background-size: 100% 100%; 
            background-repeat: no-repeat; border-radius: 15px;
            display: flex; flex-direction: column; justify-content: flex-end;
            border: 2px solid var(--accent); overflow: hidden; cursor: pointer;
            backdrop-filter: blur(var(--glass-blur));
        }
        .slide-title { background: rgba(0,0,0,0.7); color: white; padding: 10px; text-align: center; font-size: 13px; font-weight: bold; }

        .movie-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 900px; margin: 0 auto; }
        .movie-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s; backdrop-filter: blur(var(--glass-blur)); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .info { padding: 10px; text-align: center; }
        .title { font-size: 13px; font-weight: bold; height: 32px; overflow: hidden; color: var(--accent); margin-bottom: 8px; }
        .btn-watch { display: block; padding: 10px; background: var(--btn-color); color: white !important; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; border: none; width: 100%; }

        .pagination { display: flex; justify-content: center; gap: 15px; margin: 25px 0; }
        .nav-btn { padding: 10px 18px; border-radius: 20px; border: none; background: var(--accent); color: #000; font-weight: bold; cursor: pointer; }
        .nav-btn:disabled { background: #666; cursor: not-allowed; }

        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: #222; margin: 20% auto; padding: 20px; border-radius: 15px; width: 80%; max-width: 300px; text-align: center; border: 2px solid var(--accent); color: white; }
        .theme-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .t-opt { padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; border: none; }
    </style>
</head>
<body data-theme="default" data-mode="light">

<div id="loader">
    <div class="load-anim"></div>
    <div class="load-text">Initializing...</div>
    <div id="fetchSource" class="fetch-source">Checking cache...</div>
</div>

<div class="header-controls">
    <button class="theme-btn" onclick="openModal()">🎨</button>
    <div class="search-container">
        <input type="text" id="searchBox" placeholder="Search Movies..." onkeyup="handleSearch()">
    </div>
    <label class="switch">
        <input type="checkbox" id="modeToggle" onclick="toggleDarkMode()">
        <span class="slider"></span>
    </label>
</div>

<div class="count-info" id="statusLabel">Total Movies: 0</div>

<div id="flipper-container">
    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="flipper-wrapper"></div>
    </div>
</div>

<div class="movie-grid" id="movie-list"></div>

<div class="pagination" id="pagination">
    <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
    <button class="nav-btn" id="nextBtn" onclick="changePage(1)">Next</button>
</div>

<div id="themeModal" class="modal">
    <div class="modal-content">
        <h3>Choose Theme</h3>
        <div class="theme-options">
            <button class="t-opt" style="background: red; color: white;" onclick="setTheme('default')">Original</button>
            <button class="t-opt" style="background: gray; color: white;" onclick="setTheme('glass')">Glassy</button>
            <button class="t-opt" style="background: purple; color: white;" onclick="setTheme('purple')">Purple</button>
            <button class="t-opt" style="background: goldenrod; color: black;" onclick="setTheme('gold')">Golden</button>
        </div>
        <br>
        <button onclick="closeModal()" style="background: #555; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; color: white;">Close</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const SPREADSHEET_ID = '1O_Ow3sEUcKWfA3sBSAV7e5y3HYuqTMu-Ayq0wIjNapc';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv`;
    const DEFAULT_IMG = 'https://i.giphy.com/media/3zhxq2ttgN6rEw8SDx/giphy.gif';

    let allMovies = [];
    let filteredMovies = [];
    let currentPage = 1;
    const itemsPerPage = 50;

    function openModal() { document.getElementById('themeModal').style.display = 'block'; }
    function closeModal() { document.getElementById('themeModal').style.display = 'none'; }
    function setTheme(t) { document.body.setAttribute('data-theme', t); localStorage.setItem('userTheme', t); closeModal(); }
    function toggleDarkMode() {
        const isD = document.getElementById('modeToggle').checked;
        const m = isD ? 'dark' : 'light';
        document.body.setAttribute('data-mode', m);
        localStorage.setItem('userMode', m);
    }

    function startPlaceholderAnimation() {
        const searchBox = document.getElementById('searchBox');
        if (!allMovies.length) return;
        const randomMovies = [...allMovies].sort(() => 0.5 - Math.random()).slice(0, 10).map(m => m.name);
        let mIdx = 0, cIdx = 0, isDeleting = false;

        function type() {
            const current = randomMovies[mIdx];
            searchBox.placeholder = "Search " + current.substring(0, cIdx + (isDeleting ? -1 : 1));
            cIdx += isDeleting ? -1 : 1;

            if (!isDeleting && cIdx > current.length) {
                isDeleting = true; setTimeout(type, 2000);
            } else if (isDeleting && cIdx < 0) {
                isDeleting = false; mIdx = (mIdx + 1) % randomMovies.length; setTimeout(type, 500);
            } else {
                setTimeout(type, isDeleting ? 50 : 100);
            }
        }
        type();
    }

    async function init() {
        // Load UI Settings
        const sT = localStorage.getItem('userTheme') || 'default';
        const sM = localStorage.getItem('userMode') || 'light';
        document.body.setAttribute('data-theme', sT);
        document.body.setAttribute('data-mode', sM);
        document.getElementById('modeToggle').checked = (sM === 'dark');

        const today = new Date().toDateString();
        const lastFetchDate = localStorage.getItem('lastFetchDate');
        const cacheData = localStorage.getItem('movieCache');
        const sourceLabel = document.getElementById('fetchSource');

        // লজিক: যদি আজকের তারিখ আগের তারিখের সাথে মেলে এবং ক্যাশ ডেটা থাকে
        if (lastFetchDate === today && cacheData) {
            sourceLabel.innerText = "Loading from Local Storage (Cached for Today)...";
            allMovies = JSON.parse(cacheData);
            setTimeout(finishInit, 1200);
        } else {
            sourceLabel.innerText = "Refreshing from Server (Daily Update)...";
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                const rows = text.split('\n').slice(1);
                allMovies = rows.map(r => {
                    const c = r.split(',');
                    return { name: c[0]?.replace(/"/g, "").trim() || '', link: c[1]?.replace(/"/g, "").trim() || '#', img: c[2]?.replace(/"/g, "").trim() || '' };
                }).filter(m => m.name !== "");
                
                localStorage.setItem('movieCache', JSON.stringify(allMovies));
                localStorage.setItem('lastFetchDate', today);
                finishInit();
            } catch (e) {
                sourceLabel.innerText = "Server Error! Loading from backup cache...";
                if(cacheData) {
                    allMovies = JSON.parse(cacheData);
                    setTimeout(finishInit, 1000);
                }
            }
        }
    }

    function finishInit() {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('statusLabel').innerText = `Total Movies: ${allMovies.length}`;
        filteredMovies = allMovies;
        setupFlipper();
        renderPage();
        startPlaceholderAnimation();
    }

    function setupFlipper() {
        const randomMovies = [...allMovies].sort(() => 0.5 - Math.random()).slice(0, 10);
        const wrapper = document.getElementById('flipper-wrapper');
        randomMovies.forEach(m => {
            const slide = document.createElement('div');
            slide.className = 'swiper-slide';
            slide.style.backgroundImage = `url('${m.img || DEFAULT_IMG}')`;
            slide.innerHTML = `<div class="slide-title">${m.name}</div>`;
            slide.onclick = () => window.location.href = m.link;
            wrapper.appendChild(slide);
        });

        new Swiper(".mySwiper", {
            effect: "coverflow",
            centeredSlides: true,
            slidesPerView: "auto",
            loop: true,
            autoplay: { delay: 2500, disableOnInteraction: false },
        });
    }

    function renderPage() {
        const start = (currentPage - 1) * itemsPerPage;
        const pageItems = filteredMovies.slice(start, start + itemsPerPage);
        const container = document.getElementById('movie-list');
        container.innerHTML = '';
        pageItems.forEach(m => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `<img src="${m.img || DEFAULT_IMG}" onerror="this.src='${DEFAULT_IMG}'"><div class="info"><div class="title">${m.name}</div><button class="btn-watch" onclick="location.href='${m.link}'">WATCH NOW</button></div>`;
            container.appendChild(card);
        });
        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = (start + itemsPerPage) >= filteredMovies.length;
        document.getElementById('pagination').style.display = filteredMovies.length > itemsPerPage ? 'flex' : 'none';
    }

    function handleSearch() {
        const query = document.getElementById('searchBox').value.toLowerCase();
        const label = document.getElementById('statusLabel');
        const flipper = document.getElementById('flipper-container');
        if(query.trim() === "") {
            flipper.style.display = "block";
            label.innerText = `Total Movies: ${allMovies.length}`;
            filteredMovies = allMovies;
        } else {
            flipper.style.display = "none";
            filteredMovies = allMovies.filter(m => m.name.toLowerCase().includes(query));
            label.innerText = `Found Movies: ${filteredMovies.length}`;
        }
        currentPage = 1;
        renderPage();
    }

    function changePage(step) { currentPage += step; renderPage(); window.scrollTo({top: 0, behavior: 'smooth'}); }

    init();
</script>
</body>
</html>
